# Held-out evaluation, Evo-Harness arm, against the final frozen harness.
#
# `frozen: true` means Reflect and both curators never run: skills are selected and injected,
# never added or revised. That is what "final frozen harness" means, and it is why the held-out
# phase has no `caps` -- nothing can grow.
#
# `store_root` is a copy made by scripts/run_experiments.sh; see harness_heldout_raw.yaml.
# Repeated here, not inherited: `api.evo` picks the driver with a plain OmegaConf.load that
# does NOT apply `base_config` (workflows/api.py:239 vs utils.load_run_configuration). Left in
# the base alone, every run silently launches upstream's evolving_main instead.
entrypoint_module: alphaapollo.core.generation.evolving.evolving_harness_main

base_config: harness_base.yaml

harness:
  arm: evo
  frozen: true
  stream_path: ./data/harness/heldout.parquet
  run_dir: ./outputs/harness/heldout-evo
  store_root: ./outputs/harness/heldout-evo/store
  selector_model_cfg:
    api_key: ""
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-32b
    temperature: 0.0
    max_tokens: 512
  wandb:
    group: heldout
    run_name: heldout-evo
run:
  tag: heldout-evo
